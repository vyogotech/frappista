name: Build and Publish Container Images

on:
  push:
    branches: [version-15, version-16, develop, fix/arm64-esbuild-watch]
    tags: ['v*']
  pull_request:
    branches: [version-15, version-16, develop, fix/arm64-esbuild-watch]
  schedule:
    - cron: '0 0 * * *' # Build daily at midnight
  repository_dispatch:
    types: [upstream_app_update]
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Existing image reference to validate without rebuilding (for example: docker.io/vyogo/erpnext:sne-version-16)'
        required: false
        default: ''
      version:
        description: 'Version tag to publish (if empty, uses branch name)'
        required: false
        default: ''
      components:
        description: 'Components to build (comma-separated: frappe,erpnext)'
        required: false
        default: 'frappe,erpnext'
      skip_sha_check:
        description: 'Skip upstream SHA check (always build)'
        type: boolean
        required: false
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      enable_multiarch: ${{ steps.vars.outputs.enable_multiarch }}
      components: ${{ steps.components.outputs.components }}
      cache-key: ${{ steps.cache-key.outputs.hash }}
      should_build: ${{ steps.check_shas.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version tag
        id: vars
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$REF_NAME" == "version-15" || "$REF_NAME" == "version-16" || "$REF_NAME" == "develop" ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="version-16"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            IMAGE_TAG="$VERSION"
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            IMAGE_TAG="${{ github.event.inputs.version }}"
          else
            IMAGE_TAG="$REF_NAME"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ github.event.inputs.version }}" != "" || "$REF_NAME" == "version-15" || "$REF_NAME" == "version-16" || "$REF_NAME" == "develop" || "$REF_NAME" == "fix/arm64-esbuild-watch" ]]; then
            ENABLE_MULTIARCH="true"
          else
            ENABLE_MULTIARCH="false"
          fi
          IMAGE_TAG="${IMAGE_TAG//\//-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "enable_multiarch=$ENABLE_MULTIARCH" >> "$GITHUB_OUTPUT"

      - name: Parse components
        id: components
        run: |
          COMPONENTS="${{ github.event.inputs.components || 'frappe,erpnext' }}"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

      - name: Restore SHA cache
        id: restore-sha
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: upstream_sha.txt
          key: upstream-sha-${{ steps.vars.outputs.version }}

      - name: Check upstream SHAs
        id: check_shas
        run: |
          TARGET_BRANCH="${{ steps.vars.outputs.version }}"
          FRAPPE_SHA=$(git ls-remote https://github.com/frappe/frappe.git refs/heads/$TARGET_BRANCH | cut -f1)
          ERPNEXT_SHA=$(git ls-remote https://github.com/frappe/erpnext.git refs/heads/$TARGET_BRANCH | cut -f1)
          COMBINED_SHA="${FRAPPE_SHA}-${ERPNEXT_SHA}"
          
          SHOULD_BUILD="true"
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.inputs.skip_sha_check }}" != "true" ]]; then
            if [[ -f upstream_sha.txt ]]; then
              PREVIOUS_SHA=$(cat upstream_sha.txt)
              if [[ "$COMBINED_SHA" == "$PREVIOUS_SHA" ]]; then
                SHOULD_BUILD="false"
                echo "No changes detected in upstream SHAs. Skipping build."
              fi
            fi
          fi
          
          echo "$COMBINED_SHA" > upstream_sha.txt
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Save SHA cache
        if: steps.check_shas.outputs.should_build == 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream_sha.txt
          key: upstream-sha-${{ steps.vars.outputs.version }}-${{ github.run_id }}


      - name: Generate cache key
        id: cache-key
        run: |
          HASH=$(echo "${{ github.sha }}-${{ github.run_id }}" | sha256sum | cut -d ' ' -f 1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check disk space before
        run: |
          echo "Available disk space before builds:"
          df -h

  build-amd64:
    needs: setup
    if: needs.setup.outputs.should_build == 'true' && !github.event.inputs.image_ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          wget https://github.com/openshift/source-to-image/releases/download/v1.6.1/source-to-image-v1.6.1-906fe48a-linux-amd64.tar.tar.gz
          mkdir -p s2i-temp && tar -xvf source-to-image-*.tar.tar.gz -C s2i-temp
          sudo mv s2i-temp/s2i /usr/local/bin/
          rm -rf s2i-temp source-to-image-*.tar.tar.gz

      - name: Registry Login
        if: github.event_name != 'pull_request'
        run: |
          podman login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" docker.io

      - name: Build and Push Frappe - AMD64
        if: contains(needs.setup.outputs.components, 'frappe') || contains(needs.setup.outputs.components, 'erpnext')
        run: |
          CACHE_REPO="docker.io/vyogo/frappista-cache-${{ needs.setup.outputs.image_tag }}"
          CACHE_FLAGS="--cache-from=$CACHE_REPO"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            CACHE_FLAGS="$CACHE_FLAGS --cache-to=$CACHE_REPO"
          fi
          make build-amd64 FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }} CACHE_FLAGS="$CACHE_FLAGS"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            make push-only-amd64 FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }}
          fi

      - name: Build and Push ERPNext - AMD64
        if: contains(needs.setup.outputs.components, 'erpnext')
        run: |
          make erpnext-amd64 FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }}
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            podman login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" docker.io
            podman tag localhost/erpnext:sne-${{ needs.setup.outputs.image_tag }}-amd64 docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erpnext:sne-${{ needs.setup.outputs.image_tag }}-amd64
            podman push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erpnext:sne-${{ needs.setup.outputs.image_tag }}-amd64
          fi

      - name: Check disk space after
        run: |
          df -h

  build-arm64:
    needs: setup
    if: needs.setup.outputs.should_build == 'true' && !github.event.inputs.image_ref && needs.setup.outputs.enable_multiarch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-user-static
          wget https://github.com/openshift/source-to-image/releases/download/v1.6.1/source-to-image-v1.6.1-906fe48a-linux-amd64.tar.tar.gz
          mkdir -p s2i-temp && tar -xvf source-to-image-*.tar.tar.gz -C s2i-temp
          sudo mv s2i-temp/s2i /usr/local/bin/
          rm -rf s2i-temp source-to-image-*.tar.tar.gz

      - name: Registry Login
        if: github.event_name != 'pull_request'
        run: |
          podman login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" docker.io

      - name: Build and Push Frappe - ARM64
        if: contains(needs.setup.outputs.components, 'frappe') || contains(needs.setup.outputs.components, 'erpnext')
        run: |
          CACHE_REPO="docker.io/vyogo/frappista-cache-${{ needs.setup.outputs.image_tag }}"
          CACHE_FLAGS="--cache-from=$CACHE_REPO"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            CACHE_FLAGS="$CACHE_FLAGS --cache-to=$CACHE_REPO"
          fi
          make build-arm64 FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }} CACHE_FLAGS="$CACHE_FLAGS"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            make push-only-arm64 FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }}
          fi

      - name: Build and Push ERPNext - ARM64
        if: contains(needs.setup.outputs.components, 'erpnext')
        run: |
          make erpnext-arm64 FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }}
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            podman login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" docker.io
            podman tag localhost/erpnext:sne-${{ needs.setup.outputs.image_tag }}-arm64 docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erpnext:sne-${{ needs.setup.outputs.image_tag }}-arm64
            podman push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erpnext:sne-${{ needs.setup.outputs.image_tag }}-arm64
          fi

      - name: Check disk space after
        run: |
          df -h

  publish-manifests:
    needs: [setup, build-amd64, build-arm64]
    if: needs.setup.outputs.should_build == 'true' && github.event_name != 'pull_request' && !github.event.inputs.image_ref && needs.setup.outputs.enable_multiarch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Registry Login
        run: |
          podman login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}" docker.io

      - name: Create Frappe Multi-arch Manifest
        if: contains(needs.setup.outputs.components, 'frappe')
        run: |
          make create-frappe-manifest FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }}

      - name: Create ERPNext Multi-arch Manifest
        if: contains(needs.setup.outputs.components, 'erpnext')
        run: |
          make create-erpnext-manifest FRAPPE_VERSION=${{ needs.setup.outputs.image_tag }} FRAPPE_BRANCH=${{ needs.setup.outputs.version }} IMAGE_TAG=${{ needs.setup.outputs.image_tag }}

  smoke-test:
    needs: [setup, build-amd64, build-arm64, publish-manifests]
    if: needs.setup.outputs.should_build == 'true' && github.event_name != 'pull_request' && !github.event.inputs.image_ref && needs.build-amd64.result == 'success' && (needs.setup.outputs.enable_multiarch != 'true' || (needs.build-arm64.result == 'success' && needs.publish-manifests.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install Cypress asset test dependencies
        run: |
          cd e2e_test/asset-integrity
          npm install

      - name: Pull built image
        run: |
          podman pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erpnext:sne-${{ needs.setup.outputs.image_tag }}-amd64

      - name: Verify multi-arch manifest
        if: github.event_name != 'pull_request' && needs.setup.outputs.enable_multiarch == 'true'
        run: |
          podman manifest inspect docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erpnext:sne-${{ needs.setup.outputs.image_tag }} | tee manifest.json
          AMD64=$(jq '[.manifests[] | select(.platform.architecture=="amd64")] | length' manifest.json)
          ARM64=$(jq '[.manifests[] | select(.platform.architecture=="arm64")] | length' manifest.json)
          echo "amd64 entries: $AMD64, arm64 entries: $ARM64"
          if [[ "$AMD64" -lt 1 || "$ARM64" -lt 1 ]]; then
            echo "::error::Multi-arch manifest missing expected architectures (need both amd64 and arm64)"
            exit 1
          fi
          echo "Multi-arch manifest verified: amd64=$AMD64, arm64=$ARM64"

      - name: Start SNE container
        run: |
          podman run -d --name sne-test \
            -p 8001:8000 \
            -e MYSQL_ROOT_PASSWORD=ChangeMe \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/erpnext:sne-${{ needs.setup.outputs.image_tag }}-amd64 \
            /usr/libexec/s2i/run
          echo "Container started, waiting for services..."

      - name: Wait for services and verify
        run: |
          MAX_WAIT=180
          ELAPSED=0

          echo "--- Waiting for MariaDB ---"
          until podman exec sne-test mysqladmin -u root -pChangeMe ping 2>/dev/null | grep -q "alive"; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            if [[ $ELAPSED -ge $MAX_WAIT ]]; then
              echo "::error::MariaDB failed to start within ${MAX_WAIT}s"
              podman logs sne-test
              exit 1
            fi
            echo "  waiting... (${ELAPSED}s)"
          done
          echo "MariaDB is up (${ELAPSED}s)"

          echo "--- Checking Redis ---"
          if ! podman exec sne-test redis-cli ping | grep -q "PONG"; then
            echo "::error::Redis is not responding"
            podman exec sne-test cat /var/log/redis.log || true
            podman logs sne-test
            exit 1
          fi
          echo "Redis is up"

          echo "--- Waiting for bench (port 8000) ---"
          ELAPSED=0
          until podman exec sne-test curl -sf http://localhost:8000/api/method/ping 2>/dev/null; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            if [[ $ELAPSED -ge $MAX_WAIT ]]; then
              echo "::error::Bench failed to start within ${MAX_WAIT}s"
              podman logs sne-test | tail -80
              exit 1
            fi
            echo "  waiting for bench... (${ELAPSED}s)"
          done
          echo "Bench is serving requests (${ELAPSED}s)"

      - name: Verify all bench processes running
        run: |
          podman exec sne-test ps aux | grep -E "redis|mysql|node|python" || true
          PROCS=$(podman exec sne-test ps aux)
          FAIL=0
          for proc in mysqld redis-server; do
            if echo "$PROCS" | grep -q "$proc"; then
              echo "$proc: running"
            else
              echo "::error::$proc is NOT running"
              FAIL=1
            fi
          done
          # esbuild watch is disabled by default in SNE mode (ENABLE_WATCH=false)
          if echo "$PROCS" | grep -Eq "node(.+esbuild| .*esbuild)"; then
            echo "esbuild/watch: running (ENABLE_WATCH=true or default Procfile)"
          else
            echo "esbuild/watch: not running (expected — disabled in SNE mode)"
          fi
          if [[ $FAIL -eq 1 ]]; then
            podman logs sne-test | tail -50
            exit 1
          fi
          echo "All critical processes verified"

      - name: Verify login and desk assets in Cypress
        env:
          BASE_URL: http://127.0.0.1:8001
          ADMIN_USER: Administrator
          ADMIN_PASSWORD: admin
        run: |
          cd e2e_test/asset-integrity
          npm run cy:run

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          podman logs sne-test 2>&1 | tail -150
          echo "=== Redis log ==="
          podman exec sne-test cat /var/log/redis.log 2>/dev/null || true
          echo "=== MariaDB log ==="
          podman exec sne-test cat /var/log/mysqld.log 2>/dev/null || true
          echo "=== Cypress screenshots ==="
          find e2e_test/asset-integrity/cypress/screenshots -type f 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          podman stop sne-test 2>/dev/null || true
          podman rm sne-test 2>/dev/null || true

  image-integrity-check:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.image_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install Cypress asset test dependencies
        run: |
          cd e2e_test/asset-integrity
          npm install

      - name: Pull requested image
        env:
          IMAGE_REF: ${{ github.event.inputs.image_ref }}
        run: |
          podman pull "$IMAGE_REF"

      - name: Best-effort manifest inspection
        env:
          IMAGE_REF: ${{ github.event.inputs.image_ref }}
        run: |
          if podman manifest inspect "$IMAGE_REF" > manifest.json 2>/dev/null; then
            echo "Image manifest details:"
            cat manifest.json
          else
            echo "No manifest list available for $IMAGE_REF, continuing with direct image validation."
          fi

      - name: Start requested image
        env:
          IMAGE_REF: ${{ github.event.inputs.image_ref }}
        run: |
          podman run -d --name sne-test \
            -p 8001:8000 \
            -e MYSQL_ROOT_PASSWORD=ChangeMe \
            "$IMAGE_REF" \
            /usr/libexec/s2i/run
          echo "Container started, waiting for services..."

      - name: Wait for services and verify
        run: |
          MAX_WAIT=180
          ELAPSED=0

          echo "--- Waiting for MariaDB ---"
          until podman exec sne-test mysqladmin -u root -pChangeMe ping 2>/dev/null | grep -q "alive"; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            if [[ $ELAPSED -ge $MAX_WAIT ]]; then
              echo "::error::MariaDB failed to start within ${MAX_WAIT}s"
              podman logs sne-test
              exit 1
            fi
            echo "  waiting... (${ELAPSED}s)"
          done
          echo "MariaDB is up (${ELAPSED}s)"

          echo "--- Checking Redis ---"
          if ! podman exec sne-test redis-cli ping | grep -q "PONG"; then
            echo "::error::Redis is not responding"
            podman exec sne-test cat /var/log/redis.log || true
            podman logs sne-test
            exit 1
          fi
          echo "Redis is up"

          echo "--- Waiting for bench (port 8000) ---"
          ELAPSED=0
          until podman exec sne-test curl -sf http://localhost:8000/api/method/ping 2>/dev/null; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))
            if [[ $ELAPSED -ge $MAX_WAIT ]]; then
              echo "::error::Bench failed to start within ${MAX_WAIT}s"
              podman logs sne-test | tail -80
              exit 1
            fi
            echo "  waiting for bench... (${ELAPSED}s)"
          done
          echo "Bench is serving requests (${ELAPSED}s)"

      - name: Verify all bench processes running
        run: |
          podman exec sne-test ps aux | grep -E "redis|mysql|node|python" || true
          PROCS=$(podman exec sne-test ps aux)
          FAIL=0
          for proc in mysqld redis-server; do
            if echo "$PROCS" | grep -q "$proc"; then
              echo "$proc: running"
            else
              echo "::error::$proc is NOT running"
              FAIL=1
            fi
          done
          # esbuild watch is disabled by default in SNE mode (ENABLE_WATCH=false)
          if echo "$PROCS" | grep -Eq "node(.+esbuild| .*esbuild)"; then
            echo "esbuild/watch: running (ENABLE_WATCH=true or default Procfile)"
          else
            echo "esbuild/watch: not running (expected — disabled in SNE mode)"
          fi
          if [[ $FAIL -eq 1 ]]; then
            podman logs sne-test | tail -50
            exit 1
          fi
          echo "All critical processes verified"

      - name: Verify login and desk assets in Cypress
        env:
          BASE_URL: http://127.0.0.1:8001
          ADMIN_USER: Administrator
          ADMIN_PASSWORD: admin
        run: |
          cd e2e_test/asset-integrity
          npm run cy:run

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          podman logs sne-test 2>&1 | tail -150
          echo "=== Redis log ==="
          podman exec sne-test cat /var/log/redis.log 2>/dev/null || true
          echo "=== MariaDB log ==="
          podman exec sne-test cat /var/log/mysqld.log 2>/dev/null || true
          echo "=== Cypress screenshots ==="
          find e2e_test/asset-integrity/cypress/screenshots -type f 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          podman stop sne-test 2>/dev/null || true
          podman rm sne-test 2>/dev/null || true
